<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Her</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e5a4b4;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 300px;
            width: 85%;
            z-index: 10;
        }
        h1 { color: #ff4d6d; font-size: 22px; margin: 15px 0; }
        p { color: #666; font-size: 14px; }
        .btn { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        
        button {
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #eee; color: #333; position: relative; }
        
        #gifContainer img { width: 100%; border-radius: 15px; min-height: 150px; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="gifContainer">
            <img src="https://media.tenor.com/p_VEcmrBsLMAAAAj/manja.gif">
        </div>
        <h1 id="question">Do you love me? 🤗</h1>
        <p id="message">nvn is all yours</p>
        <div class="btn">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContainer = document.getElementById('mainContainer');

        let clickCount = 0;

        const contents = [
            { q: "Please think again! 🙄", m: "Don't say no so fast 🥺", gif: "https://media.tenor.com/BEBopBnhjVEAAAAi/peach-and-goma-peach-goma.gif" },
            { q: "Ek aur baar soch lo! 😫", m: "I will be very sad 💔", gif: "https://media.tenor.com/GpC0Mty4Z8wAAAAi/mochi-mochi-peach-cat-peach-cat.gif" },
            { q: "Last chance! Maan jao na! 😭", m: "Now you can't click NO! 🙇‍♂️", gif: "https://media.tenor.com/cG5-wSuBxCsAAAAi/peach-cat.gif" }
        ];

        noBtn.addEventListener('click', () => {
            if (clickCount < 3) {
                document.getElementById('question').innerText = contents[clickCount].q;
                document.getElementById('message').innerText = contents[clickCount].m;
                document.getElementById('gifContainer').innerHTML = `<img src="${contents[clickCount].gif}">`;
                clickCount++;
            }
        });

        function moveButton() {
            if (clickCount >= 3) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { if (clickCount >= 3) { e.preventDefault(); moveButton(); } });
        yesBtn.addEventListener('click', () => {
            mainContainer.innerHTML = `
                <img src="https://media1.tenor.com/m/fV_389kS6SgAAAAd/mochi-pet-mochi-cat.gif" style="width:100%; border-radius:15px;">
                <h1>I knew it! ❤️</h1>
                <p>Finally you said YES! 🥰</p>
                <button style="margin-top:20px; background:#ff4d6d; color:white; border-radius:25px; padding:10px 25px; border:none; box-shadow: 0 4px 15px rgba(0,0,0,0.2);" onclick="location.reload()">Yay! 🎉</button>
            `;
        });
    </script>
</body>
</html>
