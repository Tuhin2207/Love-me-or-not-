<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aab na karke dikhaw</title>
    <style>
        /* পুরো স্ক্রিনের জন্য এক কালার এবং কোনো সাদা বক্স থাকবে না */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e5a4b4 !important; /* ভিডিওর সেই ব্যাকগ্রাউন্ড কালার */
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* কন্টেইনারের সাদা ব্যাকগ্রাউন্ড এবং বর্ডার সরিয়ে দেওয়া হয়েছে */
        .container {
            background: transparent !important; /* কোনো সাদা বক্স থাকবে না */
            box-shadow: none !important;
            max-width: 350px;
            width: 90%;
            z-index: 10;
        }

        h1 { 
            color: #333; 
            font-size: 24px; 
            margin: 15px 0; 
        }

        p { 
            color: #555; 
            font-size: 16px; 
            font-weight: bold;
        }

        .btn {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 28px;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); /* আপনার চাওয়া শ্যাডো */
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #f8f9fa; color: #333; position: relative; }

        #gifContainer img { 
            width: 180px; 
            height: auto;
            border-radius: 15px;
        }

        .success-img {
            width: 250px !important;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="gifContainer">
            <img src="https://media.tenor.com/p_VEcmrBsLMAAAAj/manja.gif">
        </div>

        <h1 id="question">Do you love me? 🤗</h1>
        <p id="message">nvn is all yours</p>

        <div class="btn">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContainer = document.getElementById('mainContainer');

        let clickCount = 0;

        const contents = [
            { q: "Please think again! 🙄", m: "itni jaldi na matt boloo😢 🥺", gif: "https://media.tenor.com/Pr1SLLaw6ssAAAAj/p1.gif" },
            { q: "Ek aur baar soch lo! 😫", m: "kyu aisa kar rahi ho pls maan jaaw😣 💔", gif: "https://media.tenor.com/GpC0Mty4Z8wAAAAi/mochi-mochi-peach-cat-peach-cat.gif" },
            { q: "beautiful plss Maan jao na! aur kinta code likh waoge 😭", m: "bohat galat bat hey yarr😭 🙇‍♂️", gif: "https://media.tenor.com/tzvzrz4famQAAAAi/couple-forgive-me.gif" }
        ];

        noBtn.addEventListener('click', () => {
            if (clickCount < 3) {
                document.getElementById('question').innerText = contents[clickCount].q;
                document.getElementById('message').innerText = contents[clickCount].m;
                document.getElementById('gifContainer').innerHTML = `<img src="${contents[clickCount].gif}">`;
                clickCount++;
            }
        });

        function moveButton() {
            if (clickCount >= 3) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { if (clickCount >= 3) { e.preventDefault(); moveButton(); } });

        yesBtn.addEventListener('click', () => {
            mainContainer.innerHTML = `
                <img src="https://media.tenor.com/ASn97P78H1MAAAAi/peach-cat-goma.gif" class="success-img">
                <h1>Yaeee.! I knew it! 💐❤️</h1>
                <p>You love me a lot! 😭😘</p>
                <button style="margin-top:20px; background:#ff4d6d; color:white; border-radius:25px; padding:12px 28px; border:none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);" onclick="location.reload()">Yay! 🎉</button>
            `;
        });
    </script>
</body>
</html>
