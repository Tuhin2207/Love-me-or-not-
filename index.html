    /* পুরো বডির ডিজাইন */
body {

    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #ffeef2; /* হালকা গোলাপি ব্যাকগ্রাউন্ড */

/* কন্টেইনারের ডিজাইন */
.container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

    width: 90%;

/* লেখার ডিজাইন */

    color: #ff4d6d;

    justify-content: space-around;
}

.btn a {
    text-decoration: none;

}

/* 'Yes' বাটন */
.btn a[href="yes.html"] {

}

/* 'No' বাটন */
