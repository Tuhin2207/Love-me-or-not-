<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Her</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            width: 85%;
            z-index: 10;
        }
        h1 { color: #ff4d6d; font-size: 22px; margin: 15px 0; }
        p { color: #666; font-size: 14px; }
        .btn { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #eee; color: #333; position: relative; }
        #gifContainer img { width: 100%; border-radius: 15px; min-height: 150px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="gifContainer">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndmZnB6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/L4lvBpHW2fAXYHoD68/giphy.gif">
        </div>

        <h1 id="question">Do you love me? 🤗</h1>
        <p id="message">nvn is all yours</p>

        <div class="btn">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const message = document.getElementById('message');
        const gifContainer = document.getElementById('gifContainer');
        const mainContainer = document.getElementById('mainContainer');

        let clickCount = 0;

        const contents = [
            { q: "Please think again! 🙄", m: "Don't say no so fast 🥺", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndmZnB6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/vA5mj9vYMUEA8/giphy.gif" },
            { q: "One more chance! 😫", m: "Why are you doing this? 💔", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndmZnB6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/3o7TKVUn7iM8FMEU24/giphy.gif" },
            { q: "Please say Yes! 😭", m: "This is not fair! 🙇‍♂️", gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndmZnB6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/BEob5qwFkSJ7G/giphy.gif" }
        ];

        noBtn.addEventListener('click', () => {
            if (clickCount < 3) {
                question.innerText = contents[clickCount].q;
                message.innerText = contents[clickCount].m;
                gifContainer.innerHTML = `<img src="${contents[clickCount].gif}">`;
                clickCount++;
            }
        });

        function moveButton() {
            if (clickCount >= 3) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            if (clickCount >= 3) { e.preventDefault(); moveButton(); }
        });

        yesBtn.addEventListener('click', () => {
            mainContainer.innerHTML = `
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndmZnB6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/l41lH4ADRtAYnGsLe/giphy.gif" style="width:100%; border-radius:15px;">
                <h1>I knew it! ❤️</h1>
                <p>Finally you said YES! 🥰</p>
                <button style="margin-top:20px; background:#ff4d6d; color:white; border-radius:25px; padding:10px 25px; border:none;" onclick="location.reload()">Yay! 🎉</button>
            `;
        });
    </script>
</body>
</html>
