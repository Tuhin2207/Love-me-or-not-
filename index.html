<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Her</title>
    <link rel="stylesheet" href="./style.css">
    <style>
    /* পুরো বডির ডিজাইন */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #ffeef2; /* হালকা গোলাপি ব্যাকগ্রাউন্ড */
    font-family: 'Poppins', sans-serif;
    text-align: center;
}

/* কন্টেইনারের ডিজাইন */
.container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    width: 90%;
}

/* লেখার ডিজাইন */
h1 {
    color: #ff4d6d;
    font-size: 24px;
    margin-top: 20px;
}

p {
    color: #555;
    font-size: 16px;
}

/* বাটনগুলোর ডিজাইন */
.btn {
    margin-top: 25px;
    display: flex;
    justify-content: space-around;
}

.btn a {
    text-decoration: none;
    padding: 12px 35px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 50px;
    transition: 0.3s;
}

/* 'Yes' বাটন */
.btn a[href="yes.html"] {
    background-color: #ff4d6d;
    color: white;
}

.btn a[href="yes.html"]:hover {
    background-color: #ff758f;
    transform: scale(1.1);
}

/* 'No' বাটন */
.btn a[href="no.html"] {
    background-color: #ddd;
    color: #333;
}

.btn a[href="no.html"]:hover {
    background-color: #bbb;
}

/* GIF সেটআপ */
.tenor-gif-embed {
    border-radius: 15px;
    overflow: hidden;
}
 
        /* বাটনটি যাতে লাফালাফি করতে পারে তার জন্য প্রয়োজনীয় স্টাইল */
        #noBtn {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="gifContainer">
            <div class="tenor-gif-embed" data-postid="22885016" data-share-method="host" data-aspect-ratio="1" data-width="100%">
                <a href="https://tenor.com/view/manja-gif-22885016">Manja Sticker</a>
            </div>
        </div>

        <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        
        <h1 id="question">Do you love me? 🤗</h1>
        <p id="message">nvn is all yours</p>

        <div class="btn">
            <a href="yes.html">Yes</a>
            <a href="#" id="noBtn">No</a>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const message = document.getElementById('message');
        const gifContainer = document.getElementById('gifContainer');

        let clickCount = 0;

        // ভিডিওর মতো ৩ বার ক্লিক করার পর ৪র্থ বার থেকে বাটন পালাবে
        const contents = [
            { q: "Please think again! 🙄", m: "Itni jaldi na matt bolo 🥺", gif: "https://tenor.com/view/panda-cry-gif-18111234" },
            { q: "Ek aur baar soch lo! 😫", m: "Kyu aisa kar rahi ho? Pls maan jao 💔", gif: "https://tenor.com/view/sad-cute-gif-21915901" },
            { q: "Beautiful pls maan jao na! 😭", m: "Bohut galat baat hai yaar 🙇‍♂️", gif: "https://tenor.com/view/cute-cry-sad-gif-19401770" }
        ];

        noBtn.addEventListener('click', (e) => {
            if (clickCount < 3) {
                e.preventDefault();
                // লেখা এবং GIF পরিবর্তন
                question.innerText = contents[clickCount].q;
                message.innerText = contents[clickCount].m;
                
                // নতুন GIF লোড করার জন্য
                gifContainer.innerHTML = `<img src="${contents[clickCount].gif}" style="width:100%; border-radius:15px;">`;
                
                clickCount++;
            }
        });

        // ৪র্থ বার থেকে বাটন পালানোর লজিক
        function moveButton() {
            if (clickCount >= 3) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            if (clickCount >= 3) {
                e.preventDefault();
                moveButton();
            }
        });
    </script>
</body>
</html>
