<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Her</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e5a4b4; /* পুরো স্ক্রিন এক কালার */
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        /* এখানে আমরা সাদা বক্সের ব্যাকগ্রাউন্ড সরিয়ে দিয়েছি */
        .container {
            max-width: 350px;
            width: 90%;
            z-index: 10;
        }

        h1 { 
            color: #333; /* গাঢ় ধূসর রঙ যাতে গোলাপিতে ফুটে ওঠে */
            font-size: 24px; 
            margin: 15px 0; 
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        p { 
            color: #555; 
            font-size: 16px; 
            font-weight: bold;
        }

        .btn {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 28px;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); /* আপনার চাওয়া শ্যাডো */
        }

        #yesBtn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #f8f9fa; color: #333; position: relative; }

        #gifContainer img { 
            width: 180px; /* GIF সাইজ একটু বড় করা হয়েছে */
            height: auto;
            border-radius: 15px;
        }

        /* সাকসেস পেজের GIF এর জন্য বিশেষ স্টাইল */
        .success-img {
            width: 250px !important;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="gifContainer">
            <img src="https://media.tenor.com/p_VEcmrBsLMAAAAj/manja.gif">
        </div>

        <h1 id="question">Do you love me? 🤗</h1>
        <p id="message">nvn is all yours</p>

        <div class="btn">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContainer = document.getElementById('mainContainer');

        let clickCount = 0;

        // আপনার পছন্দের GIF এবং টেক্সট
        const contents = [
            { q: "Please think again! 🙄", m: "Don't say no so fast 🥺", gif: "https://media.tenor.com/BEBopBnhjVEAAAAi/peach-and-goma-peach-goma.gif" },
            { q: "Ek aur baar soch lo! 😫", m: "I will be very sad 💔", gif: "https://media.tenor.com/GpC0Mty4Z8wAAAAi/mochi-mochi-peach-cat-peach-cat.gif" },
            { q: "Last chance! Maan jao na! 😭", m: "Now you can't click NO! 🙇‍♂️", gif: "https://media.tenor.com/cG5-wSuBxCsAAAAi/peach-cat.gif" }
        ];

        noBtn.addEventListener('click', () => {
            if (clickCount < 3) {
                document.getElementById('question').innerText = contents[clickCount].q;
                document.getElementById('message').innerText = contents[clickCount].m;
                document.getElementById('gifContainer').innerHTML = `<img src="${contents[clickCount].gif}">`;
                clickCount++;
            }
        });

        function moveButton() {
            if (clickCount >= 3) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => { if (clickCount >= 3) { e.preventDefault(); moveButton(); } });

        // Yes বাটনে ক্লিক করলে আপনার দেওয়া কিস GIF টা আসবে
        yesBtn.addEventListener('click', () => {
            mainContainer.innerHTML = `
                <img src="https://media.tenor.com/ujzmI6arQ8UAAAAi/prots-kiss.gif" class="success-img">
                <h1>I knew it! ❤️</h1>
                <p>Finally you said YES! 🥰</p>
                <button style="margin-top:20px; background:#ff4d6d; color:white; border-radius:25px; padding:12px 28px; border:none; box-shadow: 0 5px 15px rgba(0,0,0,0.2);" onclick="location.reload()">Yay! 🎉</button>
            `;
        });
    </script>
</body>
</html>
