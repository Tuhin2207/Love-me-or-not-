<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposed Her</title>
    <style>
            /* CSS অংশ: কনটেইনারটি একটু ছোট এবং সুন্দর করা হয়েছে */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 25px; /* ভেতরের গ্যাপ একটু বাড়ানো হয়েছে */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 300px; /* এখানে width কমিয়ে ৩০০ পিক্সেল করা হয়েছে */
            width: 85%; /* ছোট মোবাইলে যাতে স্ক্রিনের সাথে লেগে না যায় */
            z-index: 10;
        }
        /* ইমেজের সাইজও একটু ছোট করা হয়েছে যাতে সুন্দর দেখায় */
        #gifContainer img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 15px;
        }

        /* CSS অংশ: এখানেই সব ডিজাইন */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2; /* গোলাপি ব্যাকগ্রাউন্ড */
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            width: 90%;
            z-index: 10;
        }
        h1 { color: #ff4d6d; font-size: 22px; margin: 15px 0; }
        p { color: #666; font-size: 14px; }
        .btn {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button, .yay-btn {
            text-decoration: none;
            padding: 10px 30px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        #yesBtn, .yay-btn { background-color: #ff4d6d; color: white; }
        #noBtn { background-color: #eee; color: #333; }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="gifContainer">
            <img src="https://media.tenor.com/7S_9VlWz1l7kAAAAM/panda-cry.gif" style="width:100%; border-radius:15px;">
        </div>

        <h1 id="question">Do you love me? 🤗</h1>
        <p id="message">nvn is all yours</p>

        <div class="btn">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const message = document.getElementById('message');
        const gifContainer = document.getElementById('gifContainer');
        const mainContainer = document.getElementById('mainContainer');

        let clickCount = 0;

        // "No" বাটনের ডাটা
        const contents = [
            { q: "Please think again! 🙄", m: "Itni jaldi na matt bolo 🥺", gif: "https://media.tenor.com/y296_9ZRfSgAAAAM/sad-cute.gif" },
            { q: "Ek aur baar soch lo! 😫", m: "Kyu aisa kar rahi ho? Pls maan jao 💔", gif: "https://media.tenor.com/T0_6_fF6v8UAAAAM/cute-cry-sad.gif" },
            { q: "Beautiful pls maan jao na! 😭", m: "Bohut galat baat hai yaar 🙇‍♂️", gif: "https://media.tenor.com/9v8SclHwBCAAAAAM/peach-goma-love.gif" }
        ];

        // No বাটনে ক্লিক করলে যা হবে
        noBtn.addEventListener('click', () => {
            if (clickCount < 3) {
                question.innerText = contents[clickCount].q;
                message.innerText = contents[clickCount].m;
                gifContainer.innerHTML = `<img src="${contents[clickCount].gif}" style="width:100%; border-radius:15px;">`;
                clickCount++;
            }
        });

        // বাটন পালানোর লজিক
        function moveButton() {
            if (clickCount >= 3) {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            }
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            if (clickCount >= 3) {
                e.preventDefault();
                moveButton();
            }
        });

        // Yes বাটনে ক্লিক করলে যা হবে (একই পেজে পরিবর্তন)
        yesBtn.addEventListener('click', () => {
            mainContainer.innerHTML = `
                <img src="https://media.tenor.com/9v8SclHwBCAAAAAM/peach-goma-love.gif" style="width:100%; border-radius:15px;">
                <h1>I knew it! You Love me a lot 🥰</h1>
                <p>Finally you said YES! ❤️</p>
                <div class="btn">
                    <button class="yay-btn" onclick="location.reload()">Yay! 🎉</button>
                </div>
            `;
        });
    </script>
</body>
</html>
